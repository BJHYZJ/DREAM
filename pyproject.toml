[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-sim"
version = "1.0.0"
description = "DREAM indoor mobile manipulation with dynamic semantic memory in ManiSkill"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}

[project.scripts]
dream-sim = "dream_sim.run:main"
dream-sim-sources = "dream_sim.sources:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dream_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
